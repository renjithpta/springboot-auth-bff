<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOBP Identity</title><style>body{font:17px system-ui;background:#eef4f5;color:#183b4a;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;border-radius:18px;padding:40px;width:min(370px,80vw);box-shadow:0 15px 60px #183b4a15}label{display:block;margin-top:18px}input,button,a{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c3d3d7;border-radius:8px}button{background:#075e68;color:white;margin:22px 0;cursor:pointer}a{display:block;text-align:center;text-decoration:none;margin-top:12px;color:#075e68}p{color:#56717d}</style></head><body><main><h1>AOBP Identity</h1><p>Sign in with your local account or an approved organization provider.</p><p th:if="${param.error}">Sign-in failed. Check your credentials or account onboarding.</p><form method="post" th:action="@{/login}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in locally</button></form><a th:each="provider:${providers}" th:href="${provider.url}" th:text="${provider.name}"></a></main></body></html>
