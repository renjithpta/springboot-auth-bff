server:
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        - id: bff
          uri: ${BFF_URL:http://localhost:8081}
          predicates:
            - Path=/bff/**,/oauth2/authorization/**,/login/oauth2/code/**
          filters:
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Forwarded-Proto
        - id: ui
          uri: ${UI_URL:http://localhost:5173}
          predicates:
            - Path=/**
          filters:
            - RemoveRequestHeader=Cookie
            - RemoveRequestHeader=Authorization
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
